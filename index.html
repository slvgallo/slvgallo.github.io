<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Test Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 32px;
    }

    .item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>

<body>

<div class="grid">
  <a href="works/work1.html" class="item">
    <img src="https://placehold.co/600x600?text=Work+1">
  </a>

  <a href="works/work2.html" class="item">
    <img src="https://placehold.co/600x600?text=Work+2">
  </a>
</div>

</body>
</html>
