<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finite Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="title">FINITE CYCLES</h1>
    <div class="common-cycle">
      <span class="common-cycle-label">COMMON CYCLE</span>
      <span id="commonCycleValue" class="common-cycle-value">— BEATS</span>
    </div>
    <div class="transport">
      <button id="playBtn" type="button" class="btn btn-primary" aria-label="Play">PLAY</button>
      <button id="stopBtn" type="button" class="btn" aria-label="Stop and return to the start">STOP</button>
      <button id="initializeBtn" type="button" class="btn btn-danger" aria-label="Initialize the entire sequence">INITIALIZE</button>
      <button id="undoBtn" type="button" class="btn" aria-label="Undo the last structural edit" disabled>UNDO</button>
      <button id="redoBtn" type="button" class="btn" aria-label="Redo the last undone edit" disabled>REDO</button>
      <label class="tempo-label">
        TEMPO
        <input id="tempoInput" type="number" min="40" max="240" value="120" />
        <span>BPM</span>
      </label>
    </div>
  </header>

  <section class="inspector-bar" id="inspectorBar">
    <!-- compact inspector rendered here; always present -->
  </section>

  <main class="tracks" id="tracksContainer">
    <!-- track lanes rendered here -->
  </main>

  <section class="editor-section">
    <div class="editor-header">
      <h2 class="section-label">SEQUENCE TEXT</h2>
      <div class="editor-status">
        <button id="saveProjectBtn" type="button" class="editor-btn" aria-label="Save the sequence text as a .txt file">SAVE</button>
        <button id="loadProjectBtn" type="button" class="editor-btn" aria-label="Load a sequence text .txt file">LOAD</button>
        <input id="projectFileInput" type="file" accept=".txt,text/plain" hidden />
        <span id="draftStatus" class="editor-state">APPLIED</span>
        <button id="revertSequenceBtn" type="button" class="editor-btn">REVERT</button>
        <button id="applySequenceBtn" type="button" class="editor-btn editor-btn-primary">APPLY</button>
      </div>
    </div>
    <textarea id="sequenceText" spellcheck="false" autocomplete="off"></textarea>
    <p class="editor-hint">ENTER to apply · SHIFT+ENTER for newline</p>
  </section>

  <section class="timeline-section">
    <div class="timeline-header">
      <h2 class="section-label">TIMELINE</h2>
      <div class="timeline-view-toggle" id="timelineViewToggle">
        <button type="button" class="view-toggle-btn" data-view="local">LOCAL</button>
        <button type="button" class="view-toggle-btn" data-view="common">COMMON</button>
      </div>
      <div class="timeline-zoom" id="timelineZoomControls">
        <button type="button" class="zoom-btn" id="zoomOutBtn" aria-label="Zoom timeline out">−</button>
        <button type="button" class="zoom-btn" id="zoomFitBtn" aria-pressed="true" aria-label="Fit common cycle to timeline">FIT</button>
        <button type="button" class="zoom-btn" id="zoomOneToOneBtn" aria-pressed="false" aria-label="Use the same timeline scale as track lanes">1:1</button>
        <button type="button" class="zoom-btn" id="zoomInBtn" aria-label="Zoom timeline in">+</button>
        <span class="timeline-zoom-value" id="timelineZoomValue">—</span>
        <button type="button" class="zoom-btn" id="timelineFollowBtn" aria-pressed="false" aria-label="Follow timeline playhead">FOLLOW</button>
      </div>
    </div>
    <div class="timeline-scroll-shell">
      <div class="timeline-label-column" id="timelineLabelColumn"></div>
      <div class="timeline-scroll-viewport" id="timelineScrollViewport" tabindex="0" aria-label="Common cycle timeline">
        <div class="timeline-content" id="timelineContent"></div>
      </div>
    </div>
  </section>

  <footer class="status-bar">
    <span id="statusMessage" class="status-message"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
