<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DESCRIPTION</title>
  <style>
    :root {
      --bg: #f3f1eb;
      --fg: #101010;
      --max: 1120px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", YuGothic, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    main {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: max(clamp(28px, 5vw, 64px), env(safe-area-inset-top)) 0 max(110px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 clamp(76px, 11vw, 150px);
      max-width: min(100%, 14ch);
      font-size: clamp(3.2rem, 10.5vw, 9.4rem);
      font-weight: 400;
      line-height: 0.84;
      letter-spacing: -0.085em;
      overflow-wrap: anywhere;
      transition: min-height 160ms ease;
    }

    h1.title-medium {
      font-size: clamp(2.5rem, 7vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.065em;
    }

    h1.title-long {
      font-size: clamp(1.8rem, 4.8vw, 4.2rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    h1.title-very-long {
      font-size: clamp(1.35rem, 3vw, 2.6rem);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    h1.title-measure {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      margin: 0;
    }

    .description {
      max-width: 58rem;
      font-size: clamp(1.04rem, 1.55vw, 1.34rem);
      line-height: 1.72;
      letter-spacing: -0.022em;
      text-wrap: pretty;
    }

    .paragraph {
      margin: 0 0 1.62em;
    }

    .paragraph:last-child { margin-bottom: 0; }

    .sentence.is-rewriting {
      cursor: progress;
    }

    .sentence {
      transition: opacity 120ms linear;
    }

    .editor-selection-character {
      background: transparent;
      color: inherit;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .editor-selection-character.is-selected {
      background: rgba(120, 120, 125, 0.34);
    }

    .editor-caret {
      display: inline-block;
      width: 0.08em;
      height: 1em;
      margin-left: 0.04em;
      vertical-align: -0.12em;
      background: currentColor;
      animation: caret-blink 0.72s steps(1, end) infinite;
    }

    @keyframes caret-blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (max-width: 760px) {
      main {
        width: auto;
        margin: 0;
        padding-left: max(18px, env(safe-area-inset-left));
        padding-right: max(18px, env(safe-area-inset-right));
        padding-bottom: max(72px, env(safe-area-inset-bottom));
      }

      h1 {
        max-width: min(100%, 14ch);
        margin-bottom: 54px;
        font-size: clamp(2.55rem, 15vw, 4.65rem);
        line-height: 0.88;
        letter-spacing: -0.075em;
      }

      h1.title-medium {
        font-size: clamp(2rem, 10vw, 3.7rem);
      }

      h1.title-long {
        font-size: clamp(1.5rem, 7vw, 2.7rem);
        line-height: 1.05;
      }

      h1.title-very-long {
        font-size: clamp(1.15rem, 5vw, 1.9rem);
        line-height: 1.25;
      }

      .description {
        max-width: none;
        font-size: clamp(1rem, 4.25vw, 1.12rem);
        line-height: 1.78;
        letter-spacing: -0.018em;
        overflow-wrap: anywhere;
      }

      .paragraph {
        margin-bottom: 1.72em;
      }
    }

    @media (max-width: 390px) {
      h1 { font-size: clamp(2.35rem, 14vw, 3.5rem); }
      .description { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">DESCRIPTION</h1>
    <section class="description" id="description" aria-live="off"></section>
  </main>

  <script type="module" src="./description.js"></script>
</body>
</html>
