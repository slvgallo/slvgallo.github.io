<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A static viewer for a Dual-Interpretation JPEG.">
  <title>DIJP — Dual-Interpretation JPEG</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="viewer">
    <header class="intro">
      <p class="eyebrow">DIJP / 0.7</p>
      <h1>Dual-Interpretation JPEG</h1>
      <p class="description">
        One JPEG file. A standard decoder displays M. A dedicated decoder reveals A, M, and B
        from the same entropy stream.
      </p>
    </header>

    <section class="artwork" aria-label="Dual-Interpretation JPEG viewer">
      <div class="stage">
        <img
          id="standardView"
          src="./assets/dual_interpretation.jpg"
          alt="The canonical M image decoded by the browser"
          hidden
        >
        <canvas id="view" width="256" height="256" aria-label="Dedicated DIJP decoder output"></canvas>
        <p class="readout" id="readout" aria-live="polite">LOADING</p>
      </div>

      <div class="mode-switch" role="group" aria-label="Decoder mode">
        <button id="standardMode" type="button" aria-pressed="false">STANDARD</button>
        <button id="dedicatedMode" type="button" aria-pressed="true">DEDICATED</button>
      </div>

      <div class="phase-control">
        <div class="phase-heading">
          <label for="phase">PHASE</label>
          <output id="phaseValue" for="phase">0.000</output>
        </div>
        <input
          id="phase"
          type="range"
          min="0"
          max="1"
          value="0"
          step="0.001"
          aria-label="Dedicated decoder phase"
        >
      </div>

      <div class="transport" aria-label="Playback controls">
        <button class="state-button" data-phase="0" type="button">A</button>
        <button class="state-button" data-phase="0.5" type="button">M</button>
        <button class="state-button" data-phase="1" type="button">B</button>
        <button id="playPause" class="play-button" type="button">PLAY</button>
      </div>

      <p class="status" id="status" role="status">LOADING JPEG</p>
    </section>

    <footer>
      <span>STANDARD = M</span>
      <span>DEDICATED = A ↔ M ↔ B</span>
    </footer>
  </main>
</body>
</html>
